<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>manos — tabla de fugas</title>
<style>body { margin: 0; font: 14px sans-serif } p { margin: 6px 0 }</style>

<!-- La reproducción de la tabla de fugas de PLAN §7.1, con valores inventados en campos reales.
     Ningún valor de este fichero es de nadie: son literales de prueba. -->

<p><label for="pw">Contraseña</label>
   <input id="pw" name="password" type="password" autocomplete="current-password"></p>

<!-- El campo que mata el filtro de browser-use: un OTP es type=text -->
<p><label for="otp">Código de verificación</label>
   <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
          maxlength="6"></p>

<p><label for="card">Número de tarjeta</label>
   <input id="card" name="card" type="text" autocomplete="cc-number" inputmode="numeric"></p>

<!-- Un OTP sin ningún atributo duro: solo lo pilla el nivel B -->
<p><span id="otp2-lbl">Verification code</span>
   <input id="otp2" type="text" aria-labelledby="otp2-lbl"></p>

<!-- Señuelos: el nivel B los marca, y por eso el nivel B tacha y escala pero no bloquea -->
<p><label for="mail">Correo</label>
   <input id="mail" type="email" placeholder="tu correo secreto"></p>
<p><input id="busca" type="search" placeholder="Buscar en secret stuff"></p>

<!-- Un campo normal que no debe marcarse jamás -->
<p><label for="ciudad">Ciudad</label>
   <input id="ciudad" name="ciudad" type="text"></p>

<caja-fuerte></caja-fuerte>
<script>
  // Un secreto dentro de un shadow root: la hoja de estilo del documento no cruza esta frontera,
  // y por eso la redacción de capturas se escribe en el atributo style de cada nodo.
  customElements.define('caja-fuerte', class extends HTMLElement {
    connectedCallback() {
      const r = this.attachShadow({mode: 'open'});
      r.innerHTML = '<label for="pin">PIN de la tarjeta</label>' +
                    '<input id="pin" type="text">';
    }
  });
</script>
</html>
