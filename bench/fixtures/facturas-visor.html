<script>
const euros = new Intl.NumberFormat('es-ES', {style: 'currency', currency: 'EUR'});
document.getElementById('filas').replaceChildren(
  ...JSON.parse(document.getElementById('datos').textContent).map(f => {
    const tr = document.createElement('tr');
    const a = document.createElement('a');
    a.href = '#' + f.numero;
    a.textContent = f.numero;
    tr.append(document.createElement('td'));
    tr.firstChild.append(a);
    for (const [txt, cls] of [[f.cliente], [f.fecha], [f.estado], [euros.format(f.importe), 'importe']]) {
      const td = document.createElement('td');
      td.textContent = txt;
      if (cls) td.className = cls;
      tr.append(td);
    }
    return tr;
  }));
</script>
