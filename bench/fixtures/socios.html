<script>
const datos = JSON.parse(document.getElementById('datos').textContent);
const COLS = ['Nº socio', 'Nombre', 'Localidad', 'Alta', 'Cuota'], POR_PAGINA = 10;
const PAGINAS = Math.ceil(datos.length / POR_PAGINA);
let pagina = 1;

const pintar = () => {
  document.getElementById('filas').replaceChildren(...datos.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA).map(s => {
    const tr = document.createElement('tr');
    for (const c of COLS) {
      const td = document.createElement('td');
      td.textContent = s[c];
      tr.append(td);
    }
    return tr;
  }));
  document.getElementById('pagina').textContent = `Página ${pagina} de ${PAGINAS}`;
  document.getElementById('anterior').disabled = pagina === 1;
  document.getElementById('siguiente').disabled = pagina === PAGINAS;
};

document.getElementById('anterior').addEventListener('click', () => { pagina--; pintar(); });
// como tantas páginas reales, la siguiente tarda en llegar y mientras sale una fila «Cargando…»
document.getElementById('siguiente').addEventListener('click', () => {
  pagina++;
  const td = document.createElement('td');
  td.colSpan = COLS.length;
  td.textContent = 'Cargando…';
  const tr = document.createElement('tr');
  tr.append(td);
  document.getElementById('filas').replaceChildren(tr);
  setTimeout(pintar, 300);
});
pintar();
</script>
