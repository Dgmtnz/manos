<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Solicitud de ayuda — hace falta un motivo</title>
<style>
 body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
 label { display: block; margin-top: .8rem; }
 input, select, textarea { font: inherit; padding: .3rem; width: 100%; box-sizing: border-box; }
 input[type=checkbox] { width: auto; }
 .pista { color: #666; font-size: .85em; }
 fieldset { border: 1px solid #ccc; margin: 0 0 1rem; padding: .6rem 1rem 1rem; }
 legend { font-weight: 600; }
 button { font: inherit; padding: .4rem .9rem; }
</style>
<body>
<h1>Solicitud de ayuda al alquiler</h1>

<form id="ayuda" action="/no-se-envia" method="post">
 <label>Nombre y apellidos * <input name="titular" type="text" required maxlength="80"></label>
 <label>DNI o NIE * <input name="dni" type="text" required pattern="[0-9]{8}[A-Za-z]" maxlength="9"
        title="Ocho dígitos y la letra"></label>
 <label>Correo electrónico * <input name="email" type="email" required autocomplete="email"></label>
 <label>Código postal * <input name="cp" type="text" required pattern="[0-9]{5}"
        inputmode="numeric"></label>

 <label>Motivo de la solicitud *
  <textarea name="motivo" rows="4" required minlength="30" maxlength="400"
            placeholder="Explica con tus palabras por qué solicitas la ayuda"></textarea></label>
 <p class="pista">Este campo lo lee una persona. Escríbelo tú.</p>

 <p><button type="submit">Presentar la solicitud</button></p>
</form>
</body>
</html>
