<script>
// La paginación es por desplazamiento, como en tantos listados reales: entre la página 6 y la 7 se dio de
// alta un artículo y el último de la página 6 vuelve a salir el primero de la 7. Por eso se ven 113 filas
// para 112 artículos, y la página 12 trae solo 3.
const datos = JSON.parse(document.getElementById('datos').textContent);
const vista = [...datos.slice(0, 60), datos[59], ...datos.slice(60)];
const POR_PAGINA = 10, PAGINAS = Math.ceil(vista.length / POR_PAGINA);
const euros = new Intl.NumberFormat('es-ES', {style: 'currency', currency: 'EUR'});
let pagina = 1;

const pintar = () => {
  const filas = vista.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA);
  document.getElementById('filas').replaceChildren(...filas.map(p => {
    const tr = document.createElement('tr');
    for (const [txt, cls] of [[p.ref, ''], [p.nombre, ''], [euros.format(p.precio), 'precio']]) {
      const td = document.createElement('td');
      td.textContent = txt;
      if (cls) td.className = cls;
      tr.append(td);
    }
    return tr;
  }));
  document.getElementById('pagina').textContent = `Página ${pagina} de ${PAGINAS}`;
  document.getElementById('anterior').disabled = pagina === 1;
  document.getElementById('siguiente').disabled = pagina === PAGINAS;
};

document.getElementById('anterior').addEventListener('click', () => { pagina--; pintar(); });
document.getElementById('siguiente').addEventListener('click', () => { pagina++; pintar(); });
pintar();
</script>
