<script>
// Comprar a mano es tedioso a propósito: 10 por página, sin buscador y «Añadir» suma una unidad. La tienda
// declara además sus tools WebMCP (document.modelContext), que hacen lo mismo en una llamada.
// El carrito se apunta en /state/tienda-carrito (serve.py reescribe /state/tienda con el testigo).
const datos = JSON.parse(document.getElementById('datos').textContent);
const porSku = new Map(datos.map(p => [p.sku, p]));
const POR_PAGINA = 10, PAGINAS = Math.ceil(datos.length / POR_PAGINA);
const euros = new Intl.NumberFormat('es-ES', {style: 'currency', currency: 'EUR'});
const carrito = {};
let pagina = 1, pedido = false;

const guardar = () => fetch('/state/tienda-carrito', {method: 'POST', body: JSON.stringify({lineas: carrito, pedido})});
const resumen = () => Object.entries(carrito).map(([sku, n]) => `${porSku.get(sku).nombre} (${sku}) × ${n}`);

const pintarCarrito = () => {
  const lineas = resumen();
  document.getElementById('lineas').replaceChildren(...(lineas.length ? lineas : ['Vacío']).map(t => {
    const li = document.createElement('li'); li.textContent = t; return li;
  }));
  guardar();
};

const anadir = (sku, n) => { carrito[sku] = (carrito[sku] || 0) + n; pintarCarrito(); };

const pintar = () => {
  const filas = datos.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA);
  document.getElementById('filas').replaceChildren(...filas.map(p => {
    const tr = document.createElement('tr');
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Añadir'; b.setAttribute('aria-label', `Añadir ${p.nombre}`);
    b.addEventListener('click', () => anadir(p.sku, 1));
    for (const [txt, cls] of [[p.nombre, ''], [euros.format(p.precio), 'precio']]) {
      const td = document.createElement('td'); td.textContent = txt; if (cls) td.className = cls; tr.append(td);
    }
    const td = document.createElement('td'); td.append(b); tr.append(td);
    return tr;
  }));
  document.getElementById('pagina').textContent = `Página ${pagina} de ${PAGINAS}`;
  document.getElementById('anterior').disabled = pagina === 1;
  document.getElementById('siguiente').disabled = pagina === PAGINAS;
};

document.getElementById('anterior').addEventListener('click', () => { pagina--; pintar(); });
document.getElementById('siguiente').addEventListener('click', () => { pagina++; pintar(); });
document.getElementById('vaciar').addEventListener('click', () => {
  for (const k of Object.keys(carrito)) delete carrito[k];
  pintarCarrito();
});
pintar();
pintarCarrito();

const texto = o => ({content: [{type: 'text', text: typeof o === 'string' ? o : JSON.stringify(o)}]});
const plano = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const mc = document.modelContext;
if (mc) {
  mc.registerTool({
    name: 'buscar_producto', description: 'Busca en el catálogo por nombre. Devuelve hasta 10 artículos con sku, nombre y precio.',
    inputSchema: {type: 'object', properties: {q: {type: 'string', description: 'Texto a buscar'}}, required: ['q']},
    execute: ({q}) => texto(datos.filter(p => plano(p.nombre).includes(plano(String(q)))).slice(0, 10))});
  mc.registerTool({
    name: 'anadir_al_carrito', description: 'Añade unidades de un artículo al carrito, por su sku.',
    inputSchema: {type: 'object', properties: {sku: {type: 'string'}, cantidad: {type: 'integer', minimum: 1, maximum: 20}},
                  required: ['sku', 'cantidad']},
    execute: ({sku, cantidad}) => {
      const n = Number(cantidad);
      if (!porSku.has(sku)) return {content: [{type: 'text', text: `No existe el sku ${sku}`}], isError: true};
      if (!Number.isInteger(n) || n < 1 || n > 20) return {content: [{type: 'text', text: 'cantidad: entero de 1 a 20'}], isError: true};
      anadir(sku, n);
      return texto({carrito: resumen()});
    }});
  mc.registerTool({
    name: 'ver_carrito', description: 'Lo que hay en el carrito.',
    inputSchema: {type: 'object', properties: {}}, execute: () => texto({carrito: resumen()})});
  mc.registerTool({
    name: 'confirmar_pedido', description: 'Cierra la compra y cobra lo que hay en el carrito.',
    inputSchema: {type: 'object', properties: {}},
    execute: () => { pedido = true; guardar(); return texto('Pedido confirmado'); }});
}
</script>
